<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="rpsBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="120" />
    </filter>
    <filter id="rpsBlurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <linearGradient id="rpsBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>
    <radialGradient id="rpsScan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#rpsBase)" />

  <g filter="url(#rpsBlur)">
    <ellipse cx="1300" cy="120" rx="360" ry="300" fill="#3b82f6" opacity="0.20" />
    <ellipse cx="200" cy="820" rx="380" ry="300" fill="#6366f1" opacity="0.14" />
  </g>

  <!-- radar sweep rings -->
  <g transform="translate(1220,260)">
    <circle r="420" fill="url(#rpsScan)" />
    <circle r="90" fill="none" stroke="#3b82f6" stroke-opacity="0.22" stroke-width="1" />
    <circle r="180" fill="none" stroke="#3b82f6" stroke-opacity="0.16" stroke-width="1" />
    <circle r="270" fill="none" stroke="#3b82f6" stroke-opacity="0.11" stroke-width="1" />
    <circle r="360" fill="none" stroke="#3b82f6" stroke-opacity="0.07" stroke-width="1" />
    <line x1="-420" y1="0" x2="420" y2="0" stroke="#3b82f6" stroke-opacity="0.06" stroke-width="1" />
    <line x1="0" y1="-420" x2="0" y2="420" stroke="#3b82f6" stroke-opacity="0.06" stroke-width="1" />
  </g>

  <g filter="url(#rpsBlurSoft)">
    <circle cx="260" cy="160" r="140" fill="#22d3ee" opacity="0.08" />
  </g>

  <rect width="1600" height="1000" fill="#020305" opacity="0.06" />
</svg>
